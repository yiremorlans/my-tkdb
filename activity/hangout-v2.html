<!doctype html>
<!-- Hangout v2 preview (dev only, never deployed): the Hangout scene with
     the game's Live2D model in place of the sprite rig. Proof alongside v1,
     which it doesn't touch. Run: npm run dev:activity, then open
     /hangout-v2.html -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Hangout v2 Preview</title>
    <!-- A classic script (it defines the global Live2DCubismCore), served
         from /assets like the other repo assets, before the module. -->
    <script src="assets/live2d/vendor/live2dcubismcore.min.js"></script>
    <link rel="stylesheet" href="./src/hangout/hangout.css" />
    <link rel="stylesheet" href="./src/hangout-v2/preview.css" />
  </head>
  <body>
    <main id="stage" class="stage">
      <div class="hud">
        <span id="fps">-- fps</span>
        <span id="spot"></span>
      </div>
      <div id="choices" class="choices" hidden></div>
      <!-- First-time hint for the holds (preview.js, remembered per browser);
           after #choices so it can hide while they show. -->
      <div id="coach" class="coach" role="status" hidden></div>
      <!-- Bliss's three choices (holds.js plead), apart from /meet's. -->
      <div id="bliss-choices" class="choices" hidden></div>

      <section class="vn-box" aria-live="polite">
        <!-- Heartbeat hold: his pulse (beating heart, monitor trace, bpm;
             preview.js) slides out of his name plate while a hold runs. -->
        <div class="vn-name"><span id="vn-name"></span><span id="heart-monitor" class="heart-monitor" aria-hidden="true">
          <svg class="heart" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 5 6.4 5c2 0 3.3 1.1 4.1 2.3h3C14.3 6.1 15.6 5 17.6 5 21 5 23.1 8.4 21.6 11.8 19.5 16.4 12 21 12 21z"/></svg>
          <canvas id="ecg" width="168" height="36"></canvas>
          <span id="bpm">--</span>
        </span></div>
        <div class="meter" title="annoyance"><div id="meter-fill"></div></div>
        <p id="vn-text" class="vn-text"></p>
        <button id="btn-next" class="vn-next" title="Next" aria-label="Next" hidden>›</button>
        <button id="btn-debug" class="vn-icon" title="Debug controls" aria-label="Debug controls">⚙</button>
      </section>
      <button id="btn-hide-ui" class="vn-icon" title="Hide dialogue (H)" aria-label="Hide dialogue" aria-pressed="false">◉</button>
    </main>
    <aside id="controls" class="drawer" hidden></aside>
    <script type="module" src="./src/hangout-v2/preview.js"></script>
  </body>
</html>
